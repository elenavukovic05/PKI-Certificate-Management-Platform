<div class="register-container">
    <div class="register-box">
        <h2>Register</h2>
        <form [formGroup]="registerForm" (ngSubmit)="register()" >
            <div class="form-group">
            <label for="username">Username (email)</label>
            <input 
                type="text" 
                id="username" 
                formControlName="username" 
                placeholder="Enter username"
            />
        </div>
    
        <div class="form-group">
            <label for="password">Password</label>
            <input 
            type="password" 
            id="password" 
            formControlName="password" 
            placeholder="Enter password"
            />
        </div>
        <div class="form-group">
            <label for="confirmedPassword">Confirm password</label>
            <input 
            type="password" 
            id="confirmedPassword" 
            formControlName="confirmedPassword" 
            placeholder="Confirm your password"
            />
        </div>
        <div class="form-group">
            <label for="publicKey">Public key</label>
            <button type = "button" (click) = "generateKeyPair()">Generate Key Pair</button>
            <textarea
                id = "publicKey"
                readonly
                formControlName = "publicKey"
                rows = "8"
                placeholder="Your public key in PEM format">
            </textarea>
        </div>

        <div class = "form-group">
            <label for="name">Name</label>
            <input 
            type = "text"
            id = "name"
            formControlName="name"
            placeholder = "Enter name"
            />
        </div>
        <div class = "form-group">
            <label for="lastName">Last name</label>
            <input 
            type = "text"
            id = "lastName"
            formControlName="lastName"
            placeholder = "Enter last name"
            />
        </div>
        <div class = "form-group">
            <label for="organization">Organization</label>
            <select formControlName="organizationId">
                <option *ngFor="let o of organizations" [ngValue]="o.id">
                    {{ o.name }}
                </option>
            </select>
        </div>
    
        <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
        </div>
        <div *ngIf="successMessage" class="success-message">
        {{ successMessage }}
        </div>
    
        <button type = "submit">
            Register
        </button>   
    
        </form>
    </div>    
</div>
