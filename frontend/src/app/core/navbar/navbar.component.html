<nav class="navbar">
  <div class="navbar-brand">PKI System</div>
  
  <div class="navbar-links">
    <a *ngIf="role === 'CA_USER'" routerLink="/issue-certificate" routerLinkActive="active">
      Issue Certificate
    </a>
    <a *ngIf="role === 'CA_USER'" routerLink="/all-certificates" routerLinkActive="active">
      Organizations certificates
    </a>
    <a *ngIf="role === 'ADMIN'" routerLink="/create-certificates" routerLinkActive="active">
      Issue Certificate
    </a>
    <a *ngIf="role === 'ADMIN'" routerLink="/add-ca-user" routerLinkActive="active">
      Add CA Users
    </a>
    <a *ngIf="role === 'ADMIN'" routerLink="/add-organization" routerLinkActive="active">
      Add Organizations
    </a>
    <a *ngIf="role === 'USER'" routerLink="/my-certificates" routerLinkActive="active">
      My Certificates
    </a>
    <a *ngIf="role === 'USER'" routerLink="/csr" routerLinkActive="active">
      Request Certificate
    </a>
    <a *ngIf="role === 'ADMIN'" routerLink="/all-certificates" routerLinkActive="active">
      All Certificates
    </a>
    <button *ngIf="role === 'ADMIN'" 
        class="twofa-btn" 
        (click)="showRotationModal = true">
        Rotate Key
    </button>
        <button class="twofa-btn" (click)="toggle2FA()" [class.active]="twoFactorEnabled">
      {{ twoFactorEnabled ? 'Disable 2FA' : 'Enable 2FA' }}
    </button>
    <button class="logout-btn" (click)="logout()">Logout</button>
  </div>
</nav>

<app-two-factor-modal
  *ngIf="show2FAModal"
  [mode]="modalMode"
  (closed)="on2FAModalClose()"
  (success)="on2FASuccess($event)"
></app-two-factor-modal>

<app-key-rotation-modal
  *ngIf="showRotationModal"
  (closed)="showRotationModal = false">
</app-key-rotation-modal>
